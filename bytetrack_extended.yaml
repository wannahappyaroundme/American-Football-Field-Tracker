# Custom ByteTrack configuration for football play analysis
# ⭐ PHASE 6: FINAL BALANCE - Multi-detection + moderate ID stability
# Strategy: Sweet spot between coverage and stability

tracker_type: bytetrack  # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.35  # threshold for the first association (standard)
track_low_thresh: 0.20  # threshold for the second association (LOW: catch occluded players)
new_track_thresh: 0.50  # threshold for init new track (MODERATE: balanced for 22 players)
track_buffer: 90  # buffer (3 seconds @ 30fps, good for brief occlusions)
match_thresh: 0.70  # threshold for matching tracks (LENIENT: 0.70 for better re-ID, lower IoU = easier matching)
fuse_score: True  # fuse confidence scores with IOU scores during association (ultralytics 8.3+ requirement)
